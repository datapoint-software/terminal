name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # Builds and tests on every operating system the application supports. The
  # checks that give the same answer everywhere (formatting, third-party
  # notices) and the SSH tests, which need a Linux container, run on Linux
  # only; elsewhere the SSH tests skip themselves.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-15
          - name: Windows
            os: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore Datapoint.Terminal.slnx --locked-mode
      - run: dotnet build Datapoint.Terminal.slnx -c Release --no-restore
      - if: runner.os == 'Linux'
        run: dotnet format Datapoint.Terminal.slnx --verify-no-changes --no-restore
      - if: runner.os == 'Linux'
        run: dotnet run --project tools/ThirdPartyNotices -c Release --no-build -- --check
      - if: runner.os == 'Linux'
        run: docker build -t datapoint-terminal-sshd:test tests/ssh-server
      - run: dotnet test --solution Datapoint.Terminal.slnx -c Release --no-build --coverage --coverage-output-format cobertura --coverage-settings tests/coverage.config --results-directory TestResults
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-${{ matrix.name }}
          path: TestResults/*.cobertura.xml
          if-no-files-found: ignore
